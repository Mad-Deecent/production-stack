name: CI - Helm Functionality
run-name: CI - Helm Functionality - ${{ github.actor }} - ${{ github.head_ref }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ci_helm-chart.yaml"
      - "helm/**"
      - "tests/helm/**"
      - "pyproject.toml"
      - "**.py"

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docker Setup
        uses: docker/setup-buildx-action@v3

      - name: Docker Build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: INSTALL_OPTIONAL_DEP=default
          cache-from: type=gha,mode=max
          cache-to: type=gha,mode=max
          file: docker/Dockerfile
          push: false
          tags: localhost:5000/git-act-router
          outputs: type=docker,dest=image.tar

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  test:
    name: Test Helm Charts
    needs: build
    runs-on: [self-hosted, gpu]

    steps:
      ## Setup environment
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Helm Setup
        uses: azure/setup-helm@v4.3.0

      - name: Setup Minikube
        uses: medyagh/setup-minikube@latest
        with:
          addons: registry,nvidia-driver-installer,nvidia-gpu-device-plugin
          cache: true
          container-runtime: containerd
          cpus: 8
          insecure-registry: "localhost:5000"
          memory: 16384MB
          start-args: "--force"

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Conda
        uses: mamba-org/setup-micromamba@v2

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install openai

      - name: Download Image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Image
        run: |
          docker load < image.tar
          minikube image load localhost:5000/git-act-router

      ## Test 1: secure-minimal-example
      - name: Test secure-minimal-example
        run: |
          echo "Testing secure-minimal-example..."
          helm upgrade --install vllm-secure ./helm -f tests/helm/secure-minimal-example/values.yaml --debug --wait
          
      - name: Validate secure-minimal-example
        timeout-minutes: 3
        run: |
          mkdir -p output-tests/helm/secure-minimal-example
          bash tests/scripts/port-forward.sh tests/helm/secure-minimal-example/test

      - name: Cleanup secure-minimal-example
        if: always()
        run: |
          helm uninstall vllm-secure || true
          kubectl delete pods --all || true

      ## Test 2: two-pods-minimal-example  
      - name: Test two-pods-minimal-example
        run: |
          echo "Testing two-pods-minimal-example..."
          helm upgrade --install vllm-twopods ./helm -f tests/helm/two-pods-minimal-example/values.yaml --debug --wait

      - name: Validate two-pods-minimal-example
        timeout-minutes: 3
        run: |
          mkdir -p output-tests/helm/two-pods-minimal-example
          bash tests/scripts/port-forward.sh tests/helm/two-pods-minimal-example/test

      - name: Cleanup two-pods-minimal-example
        if: always()
        run: |
          helm uninstall vllm-twopods || true
          kubectl delete pods --all || true

      ## Test 3: multiple-models
      - name: Test multiple-models
        run: |
          echo "Testing multiple-models..."
          helm upgrade --install vllm-multimodel ./helm -f tests/helm/multiple-models/values.yaml --debug --wait

      - name: Validate multiple-models
        timeout-minutes: 3
        run: |
          mkdir -p output-tests/helm/multiple-models
          bash tests/scripts/port-forward.sh tests/helm/multiple-models/test

      - name: Cleanup multiple-models
        if: always()
        run: |
          helm uninstall vllm-multimodel || true
          kubectl delete pods --all || true

      ## Test Results Summary
      - name: Test Results Summary
        run: |
          echo "# Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ secure-minimal-example - Completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ two-pods-minimal-example - Completed" >> $GITHUB_STEP_SUMMARY  
          echo "✅ multiple-models - Completed" >> $GITHUB_STEP_SUMMARY

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Helm Setup
        uses: azure/setup-helm@v4.3.0

      - name: Lint Helm Chart
        run: |
          helm lint helm/.