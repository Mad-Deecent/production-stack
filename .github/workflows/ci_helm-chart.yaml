  #   runs-on: ubuntu-latest
  #   needs: [tests, lint]
  #   steps:
  #     - run: |
  #         if ${{ needs.tests.outcome }} != "success"; then
  #           echo "Tests failed"
  #           exit 1
  #         else
  #           echo "Tests passed"
  #           exit 0
  #         fi
