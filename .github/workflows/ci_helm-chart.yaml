name: CI - Helm Functionality
run-name: CI - Helm Functionality - ${{ github.actor }} - ${{ github.head_ref }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ci_helm-chart.yaml"
      - "helm/**"
      - "tests/helm/**"
      - "pyproject.toml"
      - "**.py"

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docker Setup
        uses: docker/setup-buildx-action@v3

        ## Looks like we're trying to mount
        ## pip cache in Dockerfile, so setup python
        ## to use cache from GHA
      # - name: Setup Python
      #   id: setup-python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.12"
      #     cache: "pip"

      # - name: Install Dependencies
      #   run: |
      #     pip install --upgrade pip
      #     pip install --upgrade --no-cache-dir pip setuptools_scm && \
      #     pip install --no-cache-dir .[semantic_cache,lmcache]

      - name: Docker Build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: INSTALL_OPTIONAL_DEP=default
          cache-from: type=gha,mode=max
          cache-to: type=gha,mode=max
          file: docker/Dockerfile
          push: false
          tags: localhost:5000/git-act-router
          outputs: type=docker,dest=image.tar

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  test:
    name: Test
    needs: build
    runs-on: [self-hosted, gpu]
    ## Setup matrix for tests - single test at a time
    ## Primary benefit here is to easily define tests using a consistent pattern
    ## with later opportunities to run in parallel if self-hosted runner hardware allows
    strategy:
      matrix:
        ## Test names - mapped to tests/helm/<test-name>
        test-name:
          - secure-minimal-example
          - two-pods-minimal-example
          - multiple-models
      fail-fast: true
      max-parallel: 1

    steps:
      ## Setup environment
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Helm Setup
        uses: azure/setup-helm@v4.3.0

      # - name: Docker Setup
      #   uses: docker/setup-buildx-action@v3

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4

      ## If you have minikube running on the host, comment this out
      ## and increase the parallelization of tests above
      - name: Setup Minikube
        uses: medyagh/setup-minikube@latest
        with:
          addons: registry,nvidia-driver-installer,nvidia-gpu-device-plugin
          cache: true
          container-runtime: docker
          cpus: 6
          driver: docker
          insecure-registry: "localhost:5000"
          memory: 16384
          wait: false
          start-args: "--gpus=all"

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install openai

      - name: Download Image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Image
        run: |
          docker load < image.tar
          minikube image load localhost:5000/git-act-router

      ## Install Helm Chart
      - name: Install Helm Chart
        run: |
          helm upgrade --install vllm ./helm -f tests/helm/${{ matrix.test-name }}/values.yaml --debug --namespace ${{ matrix.test-name }}

      ## Validate
      - name: Validate
        timeout-minutes: 3
        run: |
          mkdir -p output-tests/helm/${{ matrix.test-name }}
          bash tests/scripts/port-forward.sh tests/helm/${{ matrix.test-name }}/test ${{ matrix.test-name }}

      ## Test Results
      - name: Test Results
        run: |
          echo "# Test Summary - ${{ matrix.test-name }}" >> $GITHUB_STEP_SUMMARY

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Helm Setup
        uses: azure/setup-helm@v4.3.0

      - name: Lint Helm Chart
        run: |
          helm lint helm/.

  ## (Optional) Job to enforce required check for branch protection rules
  ## Check name = "ci-helm-check"
  ## Will require this workflow to pass before merging
  # ci-helm-check:
  #   runs-on: ubuntu-latest
  #   needs: [tests, lint]
  #   steps:
  #     - run: |
  #         if ${{ needs.tests.outcome }} != "success"; then
  #           echo "Tests failed"
  #           exit 1
  #         else
  #           echo "Tests passed"
  #           exit 0
  #         fi
