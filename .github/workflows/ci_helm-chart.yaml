name: CI - Helm Functionality
run-name: CI - Helm Functionality - ${{ github.actor }} - ${{ github.head_ref }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ci_helm-chart.yaml"
      - "helm/**"
      - "tests/helm/**"
      - "pyproject.toml"
      - "**.py"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docker Setup
        uses: docker/setup-buildx-action@v3

        ## Looks like we're trying to mount
        ## pip cache in Dockerfile, so setup python
        ## to use cache from GHA
      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Docker Build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: INSTALL_OPTIONAL_DEP=default
          cache-from: type=gha,mode=max
          cache-to: type=gha,mode=max
          file: docker/Dockerfile
          push: false
          tags: localhost:5000/git-act-router
          target: deploy
          outputs: type=docker,dest=image.tar

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  tests:
    needs: build
    runs-on: ubuntu-latest
    ## Setup matrix for tests
    strategy:
      matrix:
        ## Test names - mapped to tests/helm/<test-name>
        test-name:
          - secure-minimal-example
          - two-pods-minimal-example
          - multiple-models

    steps:
      ## Setup environment
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Helm Setup
        uses: azure/setup-helm@v4.3.0

      # - name: Kubectl Setup
      #   uses: azure/setup-kubectl@v4

      # - name: Set Kube Context
      #   run: |
      #     kubectl config use-context minikube

      - name: Setup Minikube
        uses: medyagh/setup-minikube@latest
        with:
          cache: true
          driver: docker
          container-runtime: containerd
          addons: registry,ingress

      - name: Download Image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Image
        run: |
          docker load < image.tar
          minikube image load localhost:5000/git-act-router

      ## Install Helm Chart
      - name: Install Helm Chart
        run: |
          helm upgrade --install vllm ./helm -f tests/helm/${{ matrix.test-name }}/values.yaml --wait --timeout 2m

      ## Validate
      - name: Validate
        run: |
          bash tests/helm/${{ matrix.test-name }}/test.sh

      ## Test Results
      - name: Test Results
        run: |
          echo "# Test Summary - ${{ matrix.test-name }}" >> $GITHUB_STEP_SUMMARY

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Helm Setup
        uses: azure/setup-helm@v4.3.0

      - name: Lint Helm Chart
        run: |
          helm lint helm/.

  ## (Optional) Job to enforce required check for branch protection rules
  ## Check name = "ci-helm-check"
  ## Will require this workflow to pass before merging
