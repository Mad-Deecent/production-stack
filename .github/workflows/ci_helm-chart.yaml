name: CI - Helm Functionality
run-name: CI - Helm Functionality - ${{ github.actor }} - ${{ github.head_ref }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ci_helm-chart.yaml"
      - "helm/**"
      - "tests/helm/**"
      - "pyproject.toml"
      - "**.py"

jobs:
  build:
    runs-on: [self-hosted, gpu]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup buildx to push to microk8s registry
      # https://docs.docker.com/build/ci/github-actions/configure-builder/#registry-mirror
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["docker.io"]
            [registry."index.docker.io"]
              mirrors = ["index.docker.io"]
            [registry."host.docker.internal:32000"]
              http = true
              insecure = true
            [registry."localhost:32000"]
              http = true
              insecure = true

      - name: Docker Build
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          build-args: INSTALL_OPTIONAL_DEP=default
          cache-from: type=gha,mode=max
          cache-to: type=gha,mode=max
          file: docker/Dockerfile
          push: true
          target: deploy
          tags: localhost:32000/git-act-router

  test:
    name: Test
    needs: build
    runs-on: [self-hosted, gpu]
    ## Setup matrix for tests - single test at a time
    ## Primary benefit here is to easily define tests using a consistent pattern
    ## with later opportunities to run in parallel if self-hosted runner hardware allows
    strategy:
      matrix:
        ## Test names - mapped to tests/helm/<test-name>
        test-name:
          - secure-minimal-example
          - two-pods-minimal-example
          - multiple-models
      fail-fast: false
    env:
      AGENT_TOOLSDIRECTORY: /opt/hostedtoolcache
      RUNNER_TOOL_CACHE: /opt/hostedtoolcache
    steps:
      ## Setup environment
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Helm Setup
        uses: azure/setup-helm@v4.3.0

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4

      - name: Cleanup namespace
        run: |
          kubectl delete namespace ${{ matrix.test-name }} || true

      ## Install Helm Chart
      - name: Install Helm Chart
        run: |
          helm upgrade --install vllm ./helm -f tests/helm/${{ matrix.test-name }}/values.yaml --create-namespace -n ${{ matrix.test-name }}

      ## Validate
      - name: Validate
        timeout-minutes: 3
        run: |
          mkdir -p output-tests/helm/${{ matrix.test-name }}
          bash tests/scripts/port-forward.sh tests/helm/${{ matrix.test-name }}/test ${{ matrix.test-name }}

      ## Test Results
      - name: Test Results
        run: |
          echo "# Test Summary - ${{ matrix.test-name }}" >> $GITHUB_STEP_SUMMARY

      - name: Uninstall Helm Chart
        if: always()
        run: |
          helm uninstall vllm-${{ matrix.test-name }} -n ${{ matrix.test-name }} || true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Helm Setup
        uses: azure/setup-helm@v4.3.0

      - name: Lint Helm Chart
        run: |
          helm lint helm/.

  ## (Optional) Job to enforce required check for branch protection rules
  ## Check name = "ci-helm-check"
  ## Will require this workflow to pass before merging
