servingEngineSpec:
  runtimeClassName: ""
  modelSpec:
    - name: "opt125m"
      repository: "vllm/vllm-openai"
      # tag: "latest"
      tag: "v0.5.5"
      modelURL: "facebook/opt-125m"
      replicaCount: 1
      requestCPU: 6
      requestMemory: "16Gi"
      requestGPU: 1
      pvcStorage: "10Gi"
      pvcAccessMode:
        - ReadWriteOnce

    - name: "smol135m"
      repository: "vllm/vllm-openai"
      # tag: "latest"
      tag: "v0.5.5"
      modelURL: "HuggingFaceTB/SmolLM2-135M-Instruct"
      replicaCount: 1
      requestCPU: 6
      requestMemory: "16Gi"
      requestGPU: 1
      pvcStorage: "10Gi"
      pvcAccessMode:
        - ReadWriteOnce

routerSpec:
  repository: "localhost:32000/git-act-router"
  imagePullPolicy: "IfNotPresent"
  enableRouter: true
