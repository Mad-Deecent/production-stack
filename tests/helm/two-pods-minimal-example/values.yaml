servingEngineSpec:
  strategy:
    type: Recreate
  runtimeClassName: ""
  modelSpec:
    - name: "opt125m"
      repository: "vllm/vllm-openai"
      # tag: "latest"
      tag: "v0.5.5"
      modelURL: "facebook/opt-125m"

      replicaCount: 2

      requestCPU: 6
      requestMemory: "16Gi"
      requestGPU: 0

      pvcStorage: "10Gi"
      pvcAccessMode:
        - ReadWriteMany

      vllmConfig:
        maxModelLen: 1024
        extraArgs: ["--disable-log-requests", "--gpu-memory-utilization", "0.4"]

routerSpec:
  repository: "localhost:32000/git-act-router"
  imagePullPolicy: "IfNotPresent"
  enableRouter: true
